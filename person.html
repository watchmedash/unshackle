<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){if(localStorage.getItem("df_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Person – Dashtube</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" fetchpriority="high">
<style>
  @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 900; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2") format("woff2"); }
  @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-regular-400.woff2") format("woff2"); }
  @font-face { font-family: "Font Awesome 6 Brands"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-brands-400.woff2") format("woff2"); }
</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
<style>
.person-header {
  display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px;
}
.person-photo {
  flex-shrink: 0; width: 90px; height: 90px; border-radius: 50%;
  object-fit: cover; background: var(--surface2); border: 2px solid var(--border);
}
.person-photo-ph {
  flex-shrink: 0; width: 90px; height: 90px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 32px;
}
.person-meta { flex: 1; min-width: 0; }
.person-name { font-size: 22px; font-weight: 700; line-height: 1.2; color: var(--text); margin-bottom: 6px; }
.person-known { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.person-bio {
  font-size: 13px; color: var(--text-muted); line-height: 1.75;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.person-bio.expanded { -webkit-line-clamp: unset; }
</style>
<!--<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5412699736062085" crossorigin="anonymous"></script>-->
</head>
<body class="no-search">

<!-- MINIMAL HEADER -->
<header class="yt-header">
  <div class="yt-header-left">
    <a href="javascript:history.back()" class="yt-icon-btn" title="Back"><i class="fas fa-arrow-left"></i></a>
    <a href="index.html" class="yt-logo">Dash<span>tube</span></a>
  </div>
  <div class="yt-header-right">
    <button class="yt-icon-btn" onclick="toggleTheme()" title="Toggle theme"><i class="fas fa-moon theme-icon"></i></button>
  </div>
</header>

<main style="margin-top: var(--header-h); padding: 24px 20px;">

  <div class="person-header" id="personHeader">
    <div class="person-photo-ph"><i class="fas fa-user"></i></div>
    <div class="person-meta">
      <div class="skel" style="height:20px;width:55%;margin-bottom:8px;border-radius:4px;"></div>
      <div class="skel" style="height:11px;width:40%;margin-bottom:6px;border-radius:4px;"></div>
      <div class="skel" style="height:11px;width:70%;border-radius:4px;"></div>
    </div>
  </div>
  <p class="person-bio" id="personBio"></p>
  <button id="bioToggle" onclick="toggleBio()" style="display:none;font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;">Show more</button>

  <div class="section-header" id="moviesHeader" style="display:none;margin-top:8px;">
    <h2 class="section-title">Movies</h2>
  </div>
  <div class="grid" id="moviesGrid" style="margin-bottom:24px;"></div>

  <div class="section-header" id="showsHeader" style="display:none;">
    <h2 class="section-title">TV <span>Shows</span></h2>
  </div>
  <div class="grid" id="showsGrid"></div>

</main>

<script src="app.js"></script>
<script src="person.js"></script>
</body>
</html>
