<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){if(localStorage.getItem("df_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch TV Show – Dashtube</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" fetchpriority="high">
<style>
  @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 900; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2") format("woff2"); }
  @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-regular-400.woff2") format("woff2"); }
  @font-face { font-family: "Font Awesome 6 Brands"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-brands-400.woff2") format("woff2"); }
</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
<!--<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5412699736062085" crossorigin="anonymous"></script>-->
<script src="https://pl29494302.effectivecpmnetwork.com/30/f4/4e/30f44ef9510cf64a5f8634f83aebcc85.js"></script>
</head>
<body class="no-search">

<!-- MINIMAL HEADER -->
<header class="yt-header">
  <div class="yt-header-left">
    <a href="javascript:history.back()" class="yt-icon-btn" title="Back"><i class="fas fa-arrow-left"></i></a>
    <a href="index.html" class="yt-logo">Dash<span>tube</span></a>
  </div>
  <div class="yt-header-right">
    <button class="yt-icon-btn" onclick="toggleTheme()" title="Toggle theme"><i class="fas fa-moon theme-icon"></i></button>
  </div>
</header>

<div class="yt-player-main">
  <div class="player-wrap">

    <div class="player-main">
      <div class="srv-tabs" id="srvTabs">
        <button class="srv-tab active" data-idx="0">Server 1</button>
        <button class="srv-tab" data-idx="1">Server 2</button>
        <button class="srv-tab" data-idx="2">Server 3</button>
        <button class="srv-tab" data-idx="3">Server 4</button>
        <button class="srv-tab" data-idx="4">Server 5</button>
      </div>
      <div class="ep-selectors">
        <select class="ep-sel" id="seasonSel"><option>Loading…</option></select>
      </div>
      <div class="ep-grid" id="epGrid"></div>
      <div class="vid-wrap">
        <iframe id="vidPlayer" src="" allowfullscreen allow="autoplay; fullscreen" scrolling="no"></iframe>
      </div>
      <div class="act-row">
        <button class="act-btn primary" id="trlBtn" style="display:none;">
          <i class="fas fa-play"></i> Trailer
        </button>
        <button class="act-btn sec" id="wlBtn">
          <i class="fas fa-bookmark"></i> Add to Watchlist
        </button>
        <a class="act-btn sec" id="dlBtn" href="#" target="_blank" rel="noopener">
          <i class="fas fa-download"></i> Download
        </a>
      </div>
      <p class="dl-note"><i class="fas fa-info-circle"></i> Download doesn't work in the Android app — use a browser instead.</p>
    </div>

    <div class="player-side">
      <div class="details" id="details">
        <div class="skel" style="width:100%;aspect-ratio:16/9;border-radius:8px;"></div>
        <div class="skel" style="height:20px;width:60%;margin-top:12px;"></div>
        <div class="skel" style="height:12px;width:88%;margin-top:8px;"></div>
      </div>
    </div>

  </div>

  <div class="player-below">
    <div class="section-header">
      <h2 class="section-title">Cast</h2>
    </div>
    <div class="cast-row" id="castRow"></div>

    <div class="section-header" style="margin-top:16px;">
      <h2 class="section-title">Related <span>Shows</span></h2>
    </div>
    <div class="rel-grid" id="relGrid"></div>
  </div>
</div>

<!-- TRAILER MODAL -->
<div class="trl-modal" id="trlModal">
  <div class="trl-inner">
    <button class="trl-close" id="trlClose"><i class="fas fa-times"></i></button>
    <iframe id="trlFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"     class="nav-item"><i class="fas fa-home"></i>Home</a>
  <a href="movies.html"    class="nav-item"><i class="fas fa-film"></i>Movies</a>
  <a href="shows.html"     class="nav-item active"><i class="fas fa-tv"></i>Shows</a>
  <a href="watchlist.html" class="nav-item"><i class="fas fa-bookmark"></i>Watchlist</a>
  <a href="donate.html"    class="nav-item"><i class="fas fa-heart"></i>Donate</a>
</nav>

<script src="app.js"></script>
<script src="players.js"></script>
</body>
</html>
