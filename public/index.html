<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Race</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
  }

  #bars-list { position: relative; }

  .bar-row {
    position: absolute; left: 0; right: 0;
    transition: top .65s cubic-bezier(.25,1,.5,1);
  }

  .bar-track {
    width: 100%; position: relative; height: 38px;
    background: #ececec; border-radius: 0; overflow: visible;
  }

  .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 0;
    transition: width .5s cubic-bezier(.25,1,.5,1);
    min-width: 24px;
  }

  .bar-avatar {
    position: absolute; right: 0; top: 50%; transform: translate(50%, -50%);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
    background: rgba(255,255,255,0.35);
    overflow: hidden; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    z-index: 2;
  }
  .bar-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

  .bar-pts {
    position: absolute; left: calc(100% + 22px); top: 50%; transform: translateY(-50%);
    font-size: 13px; font-weight: 700; color: #333;
    white-space: nowrap;
  }

  #empty-msg {
    text-align: center; padding: 60px 0;
    font-size: 14px; color: #aaa;
  }
</style>
</head>
<body>

<div id="bars-list">
  <div id="empty-msg">Waiting for viewers to interact…</div>
</div>

<script>
const WS = `ws://${location.host}`;
let socket;
let racers = [];
const ROW_H = 41;

function initWS() {
  socket = new WebSocket(WS);
  socket.onmessage = e => handle(JSON.parse(e.data));
  socket.onclose = () => setTimeout(initWS, 1000);
  socket.onerror = () => socket.close();
}

function handle(msg) {
  if (msg.type === 'init' || msg.type === 'point_update') {
    racers = msg.racers || [];
    render();
  }
}

const COLORS = [
  '#FF6B6B','#4ECDC4','#FFD93D','#A8E6CF','#FF8B94','#B4A7D6',
  '#F4A261','#85C1E9','#F1948A','#82E0AA','#FBBF24','#AED6F1',
  '#D7BDE2','#A9DFBF','#FCA5A5','#6EE7B7','#93C5FD','#FCD34D',
];
const colorMap = {};
let colorIdx = 0;
function colorFor(id) {
  if (!colorMap[id]) colorMap[id] = COLORS[(colorIdx++) % COLORS.length];
  return colorMap[id];
}

function initials(name) {
  const s = name.replace(/^@/,'').replace(/_/g,' ').trim().split(/\s+/);
  return s.length >= 2 ? (s[0][0]+s[1][0]).toUpperCase() : name.replace(/^@/,'').slice(0,2).toUpperCase();
}

function render() {
  const list = document.getElementById('bars-list');
  const top20 = racers.filter(r => r.points > 0).slice(0, 20);
  const maxPts = top20[0]?.points || 1;

  const em = document.getElementById('empty-msg');
  if (top20.length && em) em.remove();
  if (!top20.length) {
    if (!em) list.innerHTML = '<div id="empty-msg">Waiting for viewers to interact…</div>';
    list.style.height = '';
    return;
  }

  list.style.height = `${top20.length * ROW_H}px`;

  top20.forEach((r, i) => {
    const pct = Math.max(2, (r.points / maxPts) * 72);
    const color = colorFor(r.id);

    let row = document.getElementById(`row-${r.id}`);
    if (!row) {
      row = document.createElement('div');
      row.id = `row-${r.id}`;
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-track">
          <div class="bar-fill" style="background:${color}">
            <div class="bar-avatar" id="av-${r.id}">${initials(r.name)}</div>
            <div class="bar-pts"></div>
          </div>
        </div>
      `;
      row.style.top = `${top20.length * ROW_H}px`;
      list.appendChild(row);
      if (r.profilePic) setAvatar(r.id, r.profilePic);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.style.top = `${i * ROW_H}px`;
      }));
    } else {
      row.style.top = `${i * ROW_H}px`;
    }

    row.querySelector('.bar-fill').style.width = `${pct}%`;
    row.querySelector('.bar-pts').textContent = fmtPts(r.points, r.name);
  });

  Array.from(list.children).forEach(child => {
    if (!child.id.startsWith('row-')) return;
    const id = child.id.replace('row-', '');
    if (!top20.find(r => r.id === id)) {
      child.style.opacity = '0';
      setTimeout(() => child.remove(), 650);
    }
  });
}

function setAvatar(id, url) {
  const av = document.getElementById(`av-${id}`);
  if (!av) return;
  const img = document.createElement('img');
  img.src = url;
  img.onerror = () => {};
  img.onload = () => { av.innerHTML = ''; av.appendChild(img); };
}

function fmtPts(n, name) {
  return n + ' ' + (name || '').replace(/^@/, '');
}

initWS();
</script>
</body>
</html>
