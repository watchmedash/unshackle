<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: top left;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client/renderer.js"></script>
  <script src="/client/effects.js"></script>
  <script src="/client/hud.js"></script>
  <script>
    const app = new PIXI.Application({
      width: 1080,
      height: 1920,
      backgroundColor: 0xC8EEFF,
      antialias: true,
      resolution: 1,
    });
    document.getElementById('stage').appendChild(app.view);

    function fitStage() {
      const scaleX = window.innerWidth  / 1080;
      const scaleY = window.innerHeight / 1920;
      const scale  = Math.min(scaleX, scaleY);
      const ox = (window.innerWidth  - 1080 * scale) / 2;
      const oy = (window.innerHeight - 1920 * scale) / 2;
      document.getElementById('stage').style.transform =
        `translate(${ox}px, ${oy}px) scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    const renderer = createRenderer(app);
    const effects  = createEffects(app);
    const hud      = createHud(app);
    const socket   = io();

    let prevSnapshot = null;
    let currSnapshot = null;
    let lastSnapshotTime = 0;
    const SNAPSHOT_INTERVAL = 50;

    socket.on('state', (snapshot) => {
      prevSnapshot = currSnapshot;
      currSnapshot = snapshot;
      lastSnapshotTime = performance.now();

      for (const fx of snapshot.fx || []) effects.play(fx);

      hud.update((snapshot.balls || []).length);
    });

    app.ticker.add(() => {
      if (!currSnapshot) return;
      const alpha = Math.min(1, (performance.now() - lastSnapshotTime) / SNAPSHOT_INTERVAL);
      renderer.render(prevSnapshot, currSnapshot, alpha);
    });
  </script>
</body>
</html>
