<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Arena — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0d0d1a; color: #e0e0f0; padding: 48px 32px; max-width: 480px; }
    h1 { font-size: 28px; color: #cc44ff; margin: 0 0 32px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    input {
      width: 100%; padding: 14px 16px; font-size: 18px;
      background: #1a1a2e; border: 2px solid #333; color: #fff;
      border-radius: 8px; margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #cc44ff; }
    .btns { display: flex; gap: 12px; }
    button {
      flex: 1; padding: 14px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    #connectBtn    { background: #22cc66; color: #000; }
    #disconnectBtn { background: #cc2244; color: #fff; }
    #status {
      margin-top: 28px; padding: 18px 20px; border-radius: 10px;
      background: #1a1a2e; font-size: 15px; display: flex; align-items: center; gap: 10px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .connected    .dot { background: #22cc66; }
    .connecting   .dot { background: #ffcc00; animation: pulse 1s infinite; }
    .disconnected .dot { background: #666; }
    .error        .dot { background: #cc2244; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    #statusText { flex: 1; }
    #gameLink { margin-top: 24px; font-size: 13px; color: #666; }
    #gameLink a { color: #cc44ff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Arena Admin</h1>
  <label for="usernameInput">TikTok Username</label>
  <input id="usernameInput" type="text" placeholder="@username" spellcheck="false" autocomplete="off" />
  <div class="btns">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn">Disconnect</button>
  </div>
  <div id="status" class="disconnected">
    <span class="dot"></span>
    <span id="statusText">Disconnected</span>
  </div>
  <p id="gameLink">Game view: <a href="/" target="_blank">http://localhost:7740</a></p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const input      = document.getElementById('usernameInput');
    const statusEl   = document.getElementById('status');
    const statusText = document.getElementById('statusText');

    const LABELS = {
      connected:    (u) => `Connected to @${u}`,
      connecting:   (u) => `Connecting to @${u}...`,
      disconnected: ()  => 'Disconnected',
      error:        (_, m) => `Error: ${m || 'unknown error'}`,
    };

    socket.on('tiktokStatus', ({ status, username, message }) => {
      statusEl.className = status;
      statusText.textContent = (LABELS[status] || LABELS.disconnected)(username, message);
      if (username) input.value = '@' + username;
    });

    document.getElementById('connectBtn').addEventListener('click', () => {
      const username = input.value.trim();
      if (!username) return;
      fetch('/api/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
      });
    });

    document.getElementById('disconnectBtn').addEventListener('click', () => {
      fetch('/api/disconnect', { method: 'POST' });
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('connectBtn').click();
    });
  </script>
</body>
</html>
